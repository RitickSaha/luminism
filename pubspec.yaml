name: luminism
description: >-
  Surfaces lit by one shared light that drifts and follows the phone as it
  turns. Luminism glows from within; Prism-bend splits the light into a
  spectrum.
version: 0.1.0
repository: https://github.com/RitickSaha/luminism
issue_tracker: https://github.com/RitickSaha/luminism/issues
screenshots:
  - description: Luminism and Prism-bend in dark and light themes as the light drifts.
    path: screenshots/light.webp
  - description: The example app in Luminism and Prism-bend, dark and light.
    path: screenshots/overview.png
topics:
  - ui
  - design
  - animation
  - gyroscope
  - widget

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  sensors_plus: ^7.0.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
